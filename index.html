<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLTF Model Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f0f0; }
        canvas { display: block; }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
            font-family: sans-serif;
        }
        #controls label, #controls select, #controls input[type="file"] {
            display: block;
            margin-bottom: 5px;
        }
        #error-message {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: sans-serif;
            display: none; /* Hidden by default */
        }
    </style>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
      }
    }
    </script>
</head>
<body>
    <div id="controls">
        <label for="modelInput">Load GLTF/GLB Model:</label>
        <input type="file" id="modelInput" accept=".gltf, .glb">

        <label for="animationSelect">Select Animation:</label>
        <select id="animationSelect"></select>
    </div>
    <div id="error-message"></div>
    <script type="module" src="main.js"></script>

</body>
</html>
