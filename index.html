<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLTF Model Viewer</title>
    <style>
        /* Basic Reset & Body Styles */
        * {
            box-sizing: border-box; /* Apply box-sizing globally */
        }
        body {
            margin: 0;
            overflow: hidden; /* Prevent scrollbars */
            background-color: #f0f0f0; /* Fallback background */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            color: #333;
            line-height: 1.5;
        }
        canvas {
            display: block; /* Remove extra space below canvas */
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0; /* Ensure canvas is behind UI */
        }

        /* UI Controls Panel */
        #controls {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255, 255, 255, 0.85);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            max-width: 320px; /* Limit width */
            z-index: 1; /* Ensure controls are above canvas */
            backdrop-filter: blur(5px); /* Optional: frosted glass effect */
            -webkit-backdrop-filter: blur(5px);
        }
        #controls label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9em;
            color: #444;
        }
        #controls select,
        #controls input[type="file"] {
            display: block;
            width: 100%; /* Full width within container */
            margin-bottom: 12px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fff;
            font-size: 0.9em;
            transition: border-color 0.2s ease;
        }
         #controls select:disabled {
             background-color: #eee;
             cursor: not-allowed;
         }
         #controls select:focus,
         #controls input[type="file"]:focus {
             outline: none;
             border-color: #007bff; /* Highlight focus */
             box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
         }
        /* Style file input button */
        #controls input[type="file"]::file-selector-button {
            padding: 8px 12px;
            margin-right: 10px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        #controls input[type="file"]::file-selector-button:hover {
            background-color: #0056b3;
        }

        /* Error Message Styling */
        #error-message {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px; /* Allow it to span width but with padding */
            background: rgba(220, 53, 69, 0.9); /* Bootstrap danger red */
            color: white;
            padding: 12px 18px;
            border-radius: 5px;
            font-size: 0.95em;
            display: none; /* Hidden by default */
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 2; /* Above controls if overlapping */
            max-width: 600px; /* Limit max width */
            margin: 0 auto; /* Center if max-width applies */
            text-align: center;
        }

        /* Loading Indicator Styling */
        #loading-indicator {
            position: absolute;
            top: 0; /* Cover whole screen */
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6); /* Dark overlay */
            color: white;
            display: none; /* Hidden by default */
            justify-content: center; /* Center content horizontally */
            align-items: center; /* Center content vertically */
            font-size: 1.2em;
            z-index: 10; /* Highest layer */
            cursor: progress; /* Indicate loading state */
            flex-direction: column; /* Stack spinner and text */
        }

        /* Simple CSS Spinner */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px; /* Space between spinner and text */
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
    <!-- Import Map for ES Modules -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/",
        "./config.js": "./config.js"
      }
    }
    </script>
</head>
<body>
    <!-- UI Controls -->
    <div id="controls">
        <label for="modelInput">Load GLTF/GLB/FBX Model:</label>
        <input type="file" id="modelInput" accept=".gltf,.glb,.fbx">

        <label for="animationSelect">Select Animation:</label>
        <select id="animationSelect" disabled>
            <option>Load a model first</option>
        </select>
    </div>

    <!-- Error Message Area -->
    <div id="error-message"></div>

    <!-- Loading Indicator Overlay -->
    <div id="loading-indicator">
        <div class="spinner"></div>
        <span>Loading...</span>
    </div>

    <!-- Main Script -->
    <script type="module" src="main.js"></script>

</html>
